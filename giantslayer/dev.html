<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>giantslayer dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
    </style>
  </head>
  <body>
    <script type="module">
      // The testbed: index.html with these before the boot. `?scene=<name>` enters that scene (the
      // gym when none is given, `arena` the game's fight); `?body=<model>` plays the hero as that body
      // of its rig (xbot, ybot);
      // `?watch=x,y,z` holds render3d's camera at x, z and y metres above the colossus's feet, looking at
      // the colossus, in place of the chase;
      // `?bot` names the playtester in the gym's copy and hands it the think of `giantslayer.think.ts`,
      // so the seat plays the whole loop itself;
      // `?net` draws the net a body climbs on over each wall, sphere, pillar, pole, corner, bowl and bumpy slab (their definitions' `shown`, set in the tab's
      // one copy of the definitions, which every rule and look reads; `window.__defs`).
      // After the boot, `window.__scenes` holds the truths (`__scenes.get('gym').rows`), `window.__entered`
      // the name of the one entered, and an error
      // in a step or a frame is shown over the page and kept on `window.__error`, and `window.__client`
      // is the page's client of the scene the seat is on (`__client.plugins`).
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import { sim } from './giantslayer.sim.ts'
      import { scene as gym } from './gym.sim.ts'
      import { scene as arena } from './arena.sim.ts'
      import { think } from './giantslayer.think.ts'
      import { prepared } from '#plugins/loader/loader.sim.ts'
      import file from './giantslayer.scene.json'

      const query = new URLSearchParams(location.search)
      const entered = query.get('scene') ?? 'gym'
      file.prefabs.scenemanager.entry = entered
      if (query.get('body')) file.prefabs.player.as = query.get('body')
      const bot = query.has('bot')
      if (bot) ({ gym, arena })[entered].plugins.push('playtester')
      const watch = query.get('watch')?.split(',').map(Number)
      const defs = await prepared(file.world, file.world.defs)
      if (query.has('net')) for (const kind of ['wall', 'sphere', 'pillar', 'pole', 'corner', 'bowl', 'bumpy']) defs[kind].shown = true
      window.__defs = defs

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      window.__scenes = await load(truth, import.meta.url)
      window.__entered = entered
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        window.__client = me
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
      })

      const shown = document.createElement('pre')
      shown.style.cssText = 'position:fixed;left:8px;top:8px;margin:0;color:#ff8a80;font:12px monospace;white-space:pre-wrap;max-width:90vw;z-index:9'
      document.body.appendChild(shown)
      let last = performance.now(), owed = 0, played
      const loop = async now => {
        try {
          owed += Math.min((now - last) / 1000, 0.25)
          last = now
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          // The bot's think, handed to each new client once it holds the seat's rows.
          if (bot && window.__client && window.__client !== played && __client.plugins.playtester && __client.plugins.wire.rows.some(r => r.kind === 'player' && r.data.mine)) {
            __client.plugins.playtester.play(__client.plugins.player, think(__client.plugins.wire))
            played = window.__client
          }
          if (watch && window.__client) {
            const r3 = __client.plugins.render3d
            const giant = __client.plugins.wire.rows.find(r => r.kind === 'colossus')
            if (r3?.camera && giant && r3.claim('watch')) {
              r3.camera.position.set(watch[0], giant.data.pos[1] + watch[1], watch[2])
              r3.camera.up.set(0, 1, 0)
              r3.camera.lookAt(giant.data.pos[0], giant.data.pos[1] + 9, giant.data.pos[2])
            }
          }
          await page.frame(owed / dt)
        } catch (e) { window.__error = e; shown.textContent = String(e?.stack ?? e); owed = 0 }
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
