<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>farm2d dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
      @font-face { font-family: "Pixelify Sans"; src: url("/games/farm2d/assets/PixelifySans.ttf") format("truetype"); font-weight: 400 700 }
    </style>
  </head>
  <body>
    <script type="module">
      // The testbed: `index.html`, with what the address asks changed in this tab's own copy before
      // the boot. `?entry=<scene>` enters that scene directly; `?role=<role>` enters the field playing
      // that role, as the title's button would have put the seat there; `?seed=<n>` seeds the field.
      // `?listen` keeps a readout on `window.heard`: every sound source started (the synth's notes
      // and audio's sounds alike), by kind, and the state of every AudioContext one was started on;
      // the state of every AudioContext a node was connected in or a sound decoded on; and how each
      // decode of a sound went; `struck`, every note synthaudio was asked to strike, [track, note];
      // `levels`, every track's level as the jukebox last set it; and `store`, the page's music,
      // effects and muted.
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import { sim } from './farm2d.sim.ts'
      import { scene as field } from './field.sim.ts'
      import file from './farm2d.scene.json'

      const ask = new URLSearchParams(location.search)
      if (ask.has('listen')) {
        const started = {}, contexts = new Set()
        // A buffer source has a `start` of its own, over the one every scheduled source shares.
        for (const Node of [AudioScheduledSourceNode, AudioBufferSourceNode]) {
          const start = Node.prototype.start
          Node.prototype.start = function (...a) {
            if (Node === AudioBufferSourceNode || !(this instanceof AudioBufferSourceNode)) {
              const name = this.buffer ? `${this.constructor.name} ${this.buffer.duration.toFixed(2)}s` : this.constructor.name
              started[name] = (started[name] ?? 0) + 1
              contexts.add(this.context)
            }
            return start.apply(this, a)
          }
        }
        const all = new Set(), decoded = []
        const connect = AudioNode.prototype.connect
        AudioNode.prototype.connect = function (...a) { all.add(this.context); return connect.apply(this, a) }
        const decode = BaseAudioContext.prototype.decodeAudioData
        BaseAudioContext.prototype.decodeAudioData = function (...a) {
          all.add(this)
          const p = decode.apply(this, a)
          p.then(b => decoded.push(`${b.duration.toFixed(2)}s`), e => decoded.push(`failed: ${e}`))
          return p
        }
        // Every value a gain node's gain was last set to, through `value` or `setValueAtTime`.
        window.heard = () => ({
          started: { ...started }, contexts: [...contexts].map(c => c.state), every: [...all].map(c => c.state), decoded: [...decoded],
          struck: [...struck], levels, store: page.client?.plugins.store ? Object.fromEntries(['music', 'effects', 'muted'].map(k => [k, page.client.plugins.store.get(k)])) : null,
        })
      }
      // Every note the page's synthaudio is asked to strike, [track, note], and the level of every
      // track of the project it was last handed, to three places: wrapped on each client as it is
      // mounted.
      const struck = []
      let levels = null
      const listen = me => {
        const s = me.plugins.synthaudio
        if (!ask.has('listen') || !s) return
        const attack = s.attack, use = s.use
        s.attack = (track, note, vel) => { struck.push([track, note]); return attack(track, note, vel) }
        s.use = (project, base) => {
          levels = Object.fromEntries(Object.entries(project.tracks).map(([t, v]) => [t, Math.round(v.instrument.params.gain * 1000) / 1000]))
          return use(project, base)
        }
      }
      if (ask.has('entry')) file.prefabs.scenemanager.entry = ask.get('entry')
      if (ask.has('role')) {
        file.prefabs.scenemanager.entry = 'field'
        file.prefabs.player.role = ask.get('role')
      }
      if (ask.has('seed')) field.world.seed = Number(ask.get('seed'))

      // The UI's font, loaded before any text is drawn, so none is drawn in the fallback.
      await Promise.all([document.fonts.load('400 10px "Pixelify Sans"'), document.fonts.load('700 10px "Pixelify Sans"')])

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      await load(truth, import.meta.url)
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        listen(me)
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
      })

      let last = performance.now(), owed = 0
      const loop = async now => {
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        page.input()
        while (owed >= dt) { truth.step(dt); owed -= dt }
        await page.frame(owed / dt)
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
