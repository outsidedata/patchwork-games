<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_motion3d dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
      #readout { position: fixed; left: 8px; bottom: 8px; color: #e8e8e8; font: 13px monospace; white-space: pre; background: #000a; padding: 6px 8px }
      .lil-gui.root { max-height: 100vh; overflow-y: auto }
    </style>
  </head>
  <body>
    <div id="readout"></div>
    <script type="module">
      // The testbed: index.html, the manager truth and the scenes its row names all in this tab, one
      // seat on them over a loopback, stepped on the page's clock. `?scene=<scene>` enters that scene.
      // The truths are kept on `window.__scenes` and the page on `window.__page` for the profilers
      // (benchmarking-a-game). The readout shows the keys; the frames drawn in the last second, the
      // longest of them, the step and the scene; what motion3d has the seat's body doing, read off its
      // `player` row in the scene's truth: the activity it is in, the motion it plays in it, the space and
      // its place on the point it is held to, whether its root is being eased, the layer played over
      // walking, and the activities the spaces it stands in offer; each limb motion3d bends, how much of
      // it is pinned and how far ik3d's last solve left its hand or foot from where it reaches; and the
      // last five errors the page threw or wrote.
      //
      // The panel, motion3d's settings, laid into the truth's world and the page's as they change:
      //   pin ease, s       `world.motion3d.ease`, how long a planted limb's pin eases in and out
      //   crossfade, s      anim's `fade` of the X Bot, which the root is eased over between clips too
      //   bend the limbs    ik3d's `limbs` from motion3d on or off (`world.ik3d.mods.limbs`)
      //   draw on the car   motion3d's `object` from zones on or off, the body drawn on the car as the
      //                     page draws the car, or where its row stands (`world.motion3d.mods.object`)
      //   priority          each space's priority (shapes3d's kind's `priority`, 1 where it gives none)
      // `copy motion3d JSON` copies the panel's numbers, and `reset to the file` puts the file's back.
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import { reachesOf } from '#plugins/motion3d/motion3d.sim.ts'
      import GUI from 'lil-gui'
      import { sim } from './demo_motion3d.sim.ts'
      import { scene as main } from './main.sim.ts'
      import file from './demo_motion3d.scene.json'

      const clone = v => JSON.parse(JSON.stringify(v))

      // Every error the page throws or writes, the last five, shown under the readout.
      const errors = []
      const caught = e => {
        errors.push(String(e?.message ?? e))
        if (errors.length > 5) errors.shift()
      }
      addEventListener('error', e => caught(e.error ?? e.message))
      addEventListener('unhandledrejection', e => caught(e.reason))
      const written = console.error.bind(console)
      console.error = (...a) => { caught(a.map(x => x?.message ?? x).join(' ')); written(...a) }

      file.prefabs.scenemanager.entry = new URLSearchParams(location.search).get('scene') ?? file.prefabs.scenemanager.entry

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      window.__scenes = await load(truth, import.meta.url)
      let client
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        client = me
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
        me.plugins.stats?.mount(document.body)
      })
      window.__page = page
      const readout = document.getElementById('readout')

      // The panel: the scene, chosen from the manager's table, the page loaded again on it. Keys typed
      // into it and the wheel turned over it reach neither this page nor the seat, so the wheel scrolls
      // the panel.
      const gui = new GUI({ title: 'demo_motion3d dev' })
      for (const type of ['keydown', 'keyup', 'wheel']) gui.domElement.addEventListener(type, e => e.stopPropagation())
      const chosen = { scene: file.prefabs.scenemanager.entry }
      gui.add(chosen, 'scene', Object.keys(file.prefabs.scenemanager.scenes)).onChange(s => {
        const url = new URL(location.href)
        url.searchParams.set('scene', s)
        location.href = url.href
      })
      const room = () => window.__scenes.get(chosen.scene)
      // The worlds every change is laid into: the scene's truth's and this page's.
      const worlds = () => [room()?.world, client?.plugins.wire.scene.world].filter(Boolean)

      // ---------- motion3d ----------

      // The file's settings, as they were, and the panel's copy of them.
      const spaces = Object.entries(main.world.shapes3d.kinds).filter(([, k]) => k.activities).map(([name]) => name)
      const fileOf = () => ({
        ease: main.world.motion3d.ease,
        fade: main.world.anim.kinds.xbot.fade,
        limbs: main.world.ik3d.mods.limbs !== undefined,
        object: main.world.motion3d.mods.object !== undefined,
        priority: Object.fromEntries(spaces.map(name => [name, main.world.shapes3d.kinds[name].priority ?? 1])),
      })
      const was = fileOf()
      const own = clone(was)
      const apply = () => {
        for (const world of worlds()) {
          world.motion3d.ease = own.ease
          world.anim.kinds.xbot.fade = own.fade
          if (own.limbs) world.ik3d.mods.limbs = 'motion3d'
          else delete world.ik3d.mods.limbs
          if (own.object) world.motion3d.mods.object = 'zones'
          else delete world.motion3d.mods.object
          for (const name of spaces) world.shapes3d.kinds[name].priority = own.priority[name]
        }
      }
      const mf = gui.addFolder('motion3d')
      mf.add(own, 'ease', 0, 1, 0.01).name('pin ease, s').onChange(apply)
      mf.add(own, 'fade', 0, 1, 0.01).name('crossfade, s').onChange(apply)
      mf.add(own, 'limbs').name('bend the limbs').onChange(apply)
      mf.add(own, 'object').name('draw on the car').onChange(apply)
      const pf = mf.addFolder('priority')
      for (const name of spaces) pf.add(own.priority, name, 0, 5, 1).onChange(apply)
      pf.close()
      mf.add({ copy: () => navigator.clipboard?.writeText(JSON.stringify({ motion3d: { ease: own.ease }, anim: { fade: own.fade }, priority: own.priority }, null, 2)) }, 'copy').name('copy motion3d JSON')
      mf.add({ reset: () => {
        Object.assign(own, clone(was))
        for (const c of gui.controllersRecursive()) c.updateDisplay()
        apply()
      } }, 'reset').name('reset to the file')

      // What motion3d has the seat's body doing, off its row in the scene's truth, and the limbs it bends.
      const fixed = (v, n = 2) => (Array.isArray(v) ? `[${v.map(x => x.toFixed(n)).join(', ')}]` : typeof v === 'number' ? v.toFixed(n) : String(v))
      const doing = () => {
        const truthNow = room()
        const me = truthNow?.rows.find(r => r.kind === 'player')
        if (!me) return []
        const d = me.data
        const offered = d.offered.length ? d.offered.map(a => `${a} offered`).join(', ') : 'nothing offered'
        const lines = [
          `${d.activity}${d.motion ? `.${d.motion}` : ''}   ${d.clip ?? ''}   ${offered}`,
          `space ${d.space ?? 'none'}   along ${d.along === null ? 'none' : fixed(d.along)}   ${d.eased ? (d.eased.to ? 'easing under its feet' : 'easing from the last clip') : 'not eased'}   ${d.layer ? `layer ${d.layer.activity}` : 'no layer'}`,
        ]
        const w = { world: truthNow.world, all: kind => truthNow.rows.filter(r => r.kind === kind), find: kind => truthNow.rows.find(r => r.kind === kind), get: id => truthNow.rows.find(r => r.id === id) }
        let reach = []
        try { reach = reachesOf(w, me) } catch (e) { caught(e) }
        const short = client?.plugins.ik3d?.short(me.id) ?? []
        if (reach.length) lines.push(reach.map((r, i) => `${r.bone} pinned ${fixed(r.weight)} short ${short[i] === undefined ? '-' : `${(short[i] * 100).toFixed(1)} cm`}`).join('   '))
        return lines
      }

      // The frames drawn in the last second, and the longest of them.
      const frames = []
      let last = performance.now(), owed = 0
      const loop = async now => {
        frames.push(now)
        while (frames[0] < now - 1000) frames.shift()
        const worst = frames.slice(1).reduce((m, t, i) => Math.max(m, t - frames[i]), 0)
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        // A frame that throws is shown, and the next frame goes on.
        try {
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          await page.frame(owed / dt)
        } catch (e) { caught(e) }
        readout.textContent = [
          'W A S D  walk     Shift  run     Space  jump     right drag  look     wheel  zoom     E  use',
          'zones: backflip (pink), pick up (blue), shiver (pale blue, stand still)',
          'orange wall: hang; A D shimmy, W + E climb up, S + E drop      chair: sit, E again to stand',
          'bar and ceiling: hang; A D along, E drop      rope and climbing wall: hold W to climb (S down the wall), E let go',
          'swing, run wall, vault: E      edge: E teeter, E again step down, S step back      stairs: hold W to climb',
          'pool: E fall in, hold W to swim, E by the far wall to climb out      desk, bed: E, and E again to get up',
          'car: E get in, W A S D drive, Space honk, E get out',
          'gamepad: left stick walk, right stick look, RT or L3 run, A jump, X use, d-pad up and down zoom',
          `${frames.length} fps  longest frame ${worst.toFixed(1)} ms`,
          `${chosen.scene}  step ${truth.n}`,
          ...doing(),
          ...errors,
        ].join('\n')
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
