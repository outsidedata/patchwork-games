<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_world3d meshlets</title>
    <style>
      body { margin: 0; background: #0b0b0e; overflow: hidden }
      canvas { display: block }
      #readout { position: fixed; left: 8px; bottom: 8px; color: #e8e8e8; font: 13px monospace; white-space: pre; background: #000a; padding: 6px 8px }
    </style>
  </head>
  <body>
    <div id="readout"></div>
    <script type="module">
      // Experiment: a baked place of world3d's, its glb assembled by world3d.place.ts as the game does, drawn
      // by three's WebGPURenderer through a drawing pipeline. `?pipe=` standard, meshlet (the default),
      // debug (the meshlet pipeline drawing each cluster its own colour) or vb (the visibility buffer).
      // `?place=` town (the default), village, tavern or hills. Each material is drawn in its looks
      // file's flat colour, by its vertices' lookId. Drag to turn, wheel to come nearer, right drag to move.
      import * as THREE from 'three/webgpu'
      import { attribute, uniformArray, uniform, int, texture, Fn, dFdx, dFdy, positionWorld, normalWorldGeometry, positionView, normalViewGeometry, faceDirection, select, renderGroup } from 'three/tsl'
      import { noiseBytes, randomBytes, RAND } from '#plugins/supershader3d/supershader3d.plugin.ts'
      import { COURSES, ROWS } from '#plugins/world3d/world3d.plugin.ts'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { MeshletDrawingPipeline } from 'three/addons/pipelines/MeshletDrawingPipeline.js'
      import { VisibilityBufferDrawingPipeline } from 'three/addons/pipelines/VisibilityBufferDrawingPipeline.js'
      import { unpack, assemble } from '#plugins/world3d/world3d.place.ts'

      const readout = document.getElementById('readout')
      const errors = []
      window.__errors = []
      const caught = e => { if (window.__errors.length < 50) window.__errors.push(String(e?.stack ?? e?.message ?? e).slice(0, 2000)); errors.push(String(e?.stack ?? e?.message ?? e)); if (errors.length > 5) errors.shift(); window.__error = e }
      addEventListener('error', e => caught(e.error ?? e.message))
      addEventListener('unhandledrejection', e => caught(e.reason))
      const written = console.error.bind(console)
      console.error = (...a) => { caught(a.map(x => x?.message ?? x).join(' ')); written(...a) }

      const query = new URLSearchParams(location.search)
      const pipe = query.get('pipe') ?? 'meshlet'
      const places = {
        town: ['assets/smallville.town.glb', 'assets/smallville.town.looks.json', 'assets/looks/'],
        village: ['assets/village/village.art.glb', 'assets/village/village.art.looks.json', 'assets/village/looks/'],
        tavern: ['assets/tavern/tavern.art.glb', 'assets/tavern/tavern.art.looks.json', 'assets/tavern/looks/'],
        hills: ['assets/hills/village-terrain3d.art.glb', 'assets/hills/village-terrain3d.art.looks.json', 'assets/hills/looks/'],
      }
      const placeName = query.get('place') ?? 'town'
      const [glbPath, looksPath, picturesPath] = places[placeName]
      // `?looks=0` draws each material in its flat colour; else the looks, transpiled by meshlets.transpile.mjs
      const withLooks = query.get('looks') !== '0'

      const renderer = new THREE.WebGPURenderer({ antialias: true })
      renderer.setPixelRatio(devicePixelRatio)
      renderer.setSize(innerWidth, innerHeight)
      renderer.toneMapping = THREE.NeutralToneMapping
      document.body.appendChild(renderer.domElement)
      await renderer.init()
      const pipeline = pipe === 'standard' ? null
        : pipe === 'vb' ? new VisibilityBufferDrawingPipeline()
        : new MeshletDrawingPipeline({ debug: pipe === 'debug' })
      if (pipeline) renderer.drawingPipeline = pipeline

      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#9fb6cf')
      scene.add(new THREE.HemisphereLight('#dfe8ff', '#4a4636', 1.2))
      const sun = new THREE.DirectionalLight('#fff4dc', 2.6)
      sun.position.set(60, 120, 40)
      scene.add(sun)

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 4000)
      const controls = new OrbitControls(camera, renderer.domElement)

      const [bytes, looks] = await Promise.all([
        fetch(glbPath).then(r => r.arrayBuffer()).then(b => new Uint8Array(b)),
        fetch(looksPath).then(r => r.json()),
      ])
      const place = await unpack(bytes)
      // every material's flat colour, read by the vertex's lookId
      const colours = uniformArray(looks.materials.map(m => new THREE.Color().fromArray(m.colour)), 'color')
      const flatMaterial = () => {
        const m = new THREE.MeshStandardNodeMaterial({ roughness: 0.85, metalness: 0 })
        m.colorNode = colours.element(int(attribute('look', 'vec4').x.add(0.5)))
        return m
      }

      // The looks' inputs, made as supershader3d and world3d make them, handed to the transpiled module.
      // the looks' own numbers in the render's group: the meshlet pipeline's batches have no per-object uniforms,
      // which is where a uniform goes when it names no group
      const lookTime = uniform(0).setGroup(renderGroup)
      let lookMaterial = flatMaterial
      if (withLooks) {
        // the settings table: a row a material, a texel a setting
        const { width, materials: rows } = looks.settings
        const settingsData = new Float32Array(width * Math.max(rows.length, 1) * 4)
        rows.forEach((row, id) => row.forEach((s, at) => {
          const k = (id * width + at) * 4
          if (Array.isArray(s.value)) settingsData.set(s.value, k)
          else settingsData[k] = s.value
        }))
        const settings = new THREE.DataTexture(settingsData, width, Math.max(rows.length, 1), THREE.RGBAFormat, THREE.FloatType)
        settings.magFilter = settings.minFilter = THREE.NearestFilter
        settings.needsUpdate = true
        // the shared noise and random tables
        const noise = new THREE.DataTexture(noiseBytes(), 256, 256)
        noise.wrapS = noise.wrapT = THREE.RepeatWrapping
        noise.magFilter = THREE.LinearFilter
        noise.minFilter = THREE.LinearMipmapLinearFilter
        noise.generateMipmaps = true
        noise.needsUpdate = true
        const random = new THREE.DataTexture(randomBytes(), RAND, RAND)
        random.magFilter = random.minFilter = THREE.NearestFilter
        random.needsUpdate = true
        // the course table, as world3d writes it
        const coursesData = new Float32Array((COURSES + 1) * ROWS)
        place.info.courses.forEach((r, row) => {
          for (let c = 0; c < COURSES; c++) coursesData[row * (COURSES + 1) + c] = c < r.feet.length ? r.feet[c] : 1e4 + c
          coursesData[row * (COURSES + 1) + COURSES] = r.wallDepth
        })
        const courses = new THREE.DataTexture(coursesData, COURSES + 1, ROWS, THREE.RedFormat, THREE.FloatType)
        courses.magFilter = courses.minFilter = THREE.NearestFilter
        courses.needsUpdate = true
        // the pictures, each drawn at the file's size into one layer of a stack, and each colour one's mean lightness
        const S = looks.picture, n = Math.max(looks.pictures.length, 1)
        const pixels = new Uint8Array(S * S * 4 * n)
        const means = new Array(n).fill(0.2)
        const lin = x => { x /= 255; return x <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4 }
        const canvas = document.createElement('canvas')
        canvas.width = canvas.height = S
        const g = canvas.getContext('2d', { willReadFrequently: true })
        const images = await Promise.all(looks.pictures.map(p => fetch(picturesPath + p.file).then(r => r.blob()).then(b => createImageBitmap(b))))
        images.forEach((image, i) => {
          g.clearRect(0, 0, S, S)
          g.drawImage(image, 0, 0, S, S)
          const px = g.getImageData(0, 0, S, S).data
          pixels.set(px, i * S * S * 4)
          if (looks.pictures[i].colour) {
            let s = 0, count = 0
            for (let k = 0; k < px.length; k += 4 * 257) { s += 0.2126 * lin(px[k]) + 0.7152 * lin(px[k + 1]) + 0.0722 * lin(px[k + 2]); count++ }
            means[i] = s / count
          }
        })
        const stack = new THREE.DataArrayTexture(pixels, S, S, n)
        stack.wrapS = stack.wrapT = THREE.RepeatWrapping
        stack.magFilter = THREE.LinearFilter
        stack.minFilter = THREE.LinearMipmapLinearFilter
        stack.generateMipmaps = true
        stack.needsUpdate = true
        // a picture of the stack read as the GLSL's sampler2DArray: (u, v, layer)
        const pictures = { sample: at => texture(stack, at.xy).depth(int(at.z)) }

        globalThis.lookBindings = {
          lookSettings: texture(settings),
          vLookId: attribute('look', 'vec4').x,
          vLookInfo: attribute('look', 'vec4').yzw,
          vLookUv: attribute('uv', 'vec2'),
          vLookWorld: positionWorld,
          // the geometry's own normals: normalWorld and normalView are the material's, which the looks make
          vLookWN: normalWorldGeometry,
          vS0: attribute('s0', 'vec3'),
          vS1: attribute('s1', 'vec3'),
          vS2: attribute('s2', 'vec4'),
          vS3: attribute('s3', 'vec2'),
          lookView: uniform(0).setGroup(renderGroup),
          lookDebug: uniform(0).setGroup(renderGroup),
          lookTime,
          lookPictures: pictures,
          lookMeans: uniformArray(means, 'float'),
          csNoise: texture(noise),
          csCourses: texture(courses),
          cbRand: texture(random),
          vViewPosition: positionView.negate(),
          vNormal: normalViewGeometry,
        }
        const L = await import(`./meshlets-transpiled/${placeName}.looks.tsl.js`)
        lookMaterial = call => {
          const B = globalThis.lookBindings
          const kl = Fn(() => {
            L.lookGx.assign(dFdx(B.vLookUv))
            L.lookGy.assign(dFdy(B.vLookUv))
            return L.lookRun(int(B.vLookId.add(0.5)))
          })().toVar('kl')
          const m = new THREE.MeshStandardNodeMaterial({ transparent: call === 'seeThrough', depthWrite: call !== 'seeThrough' })
          m.colorNode = kl.get('colour')
          m.roughnessNode = kl.get('rough')
          m.metalnessNode = kl.get('metal')
          m.emissiveNode = kl.get('glow')
          m.aoNode = kl.get('ao')
          if (call === 'seeThrough') m.opacityNode = kl.get('alpha')
          m.normalNode = select(kl.get('ownNormal'), kl.get('normal'), L.kitBump(positionView, L.lookPerturb(normalViewGeometry.mul(faceDirection), kl.get('nts'), faceDirection), kl.get('height'), faceDirection))
          return m
        }
      }
      const material = call => lookMaterial(call)
      const made = assemble(THREE, place, looks, material)
      // the moving things' skin and morph targets taken off: a skinned mesh is drawn by the standard pipeline
      const geo = made.geometry
      geo.deleteAttribute('skinIndex')
      geo.deleteAttribute('skinWeight')
      geo.morphAttributes = {}
      // lookId and lookInfo as one attribute, `look` (id, info): WebGPU takes at most 8 vertex buffers, and the
      // place has 9 attributes, each its own buffer where a material is drawn by the standard pipeline
      const ids = geo.getAttribute('lookId').array, info = geo.getAttribute('lookInfo').array
      const look = new Float32Array(ids.length * 4)
      for (let v = 0; v < ids.length; v++) {
        look[v * 4] = ids[v]
        look[v * 4 + 1] = info[v * 3]
        look[v * 4 + 2] = info[v * 3 + 1]
        look[v * 4 + 3] = info[v * 3 + 2]
      }
      geo.setAttribute('look', new THREE.BufferAttribute(look, 4))
      geo.deleteAttribute('lookId')
      geo.deleteAttribute('lookInfo')
      const mesh = new THREE.Mesh(geo, made.material)
      scene.add(mesh)

      geo.computeBoundingSphere()
      const { center, radius } = geo.boundingSphere
      controls.target.copy(center)
      camera.position.set(center.x + radius * 0.6, center.y + radius * 0.4, center.z + radius * 0.6)
      controls.update()

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })

      window.__three = { renderer, scene, camera, mesh }
      const triangles = geo.index.count / 3
      const frames = []
      window.__stats = {}
      renderer.setAnimationLoop(now => {
        frames.push(now)
        while (frames[0] < now - 1000) frames.shift()
        lookTime.value = now / 1000
        try { renderer.render(scene, camera) } catch (e) { caught(e) }
        const info = pipeline?.info
        window.__stats = { pipe, fps: frames.length, triangles, groups: geo.groups.length, attributes: Object.keys(geo.attributes), calls: renderer.info.render.drawCalls, info: info ? { ...info } : null }
        readout.textContent = [
          `pipe ${pipe}  ${frames.length} fps  draw calls ${renderer.info.render.drawCalls}`,
          `place: ${triangles} triangles in ${geo.groups.length} groups, attributes ${Object.keys(geo.attributes).join(' ')}`,
          info ? `meshlet pipeline drew ${info.clusters} clusters, ${info.triangles} triangles` : '',
          `camera ${camera.position.toArray().map(v => v.toFixed(1)).join(', ')}`,
          ...errors,
        ].join('\n')
      })
    </script>
  </body>
</html>
