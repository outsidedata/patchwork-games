<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hills wiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      /* The hills' wiki: every ability, effect, mob and placement of the hills scene's own files, read as the game
         reads them, so a number changed in a file is changed here on the next load. A page of the game beside dev.html,
         for reading; nothing here is written back. */
      :root {
        --night: #161d29;
        --panel: #1f2837;
        --rule: #33405a;
        --text: #e4e8ef;
        --dim: #9aa6ba;
        --ability: #f0b350;
        --effect: #e3758a;
        --mob: #8cc46f;
        --place: #74b3e6;
        --item: #c9a6f0;
        --tip: #0d1119;
        --tipline: #5d6b85;
      }
      * { box-sizing: border-box }
      body {
        margin: 0;
        background: var(--night);
        color: var(--text);
        font: 17px/1.55 'Alegreya Sans', system-ui, sans-serif;
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }
      a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px }
      a:focus-visible { outline: 2px solid var(--place); outline-offset: 2px; border-radius: 2px }
      nav {
        border-right: 1px solid var(--rule);
        padding: 28px 22px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      nav h1 { font: 700 26px/1.1 Alegreya, serif; margin: 0 0 22px }
      nav h1 a { text-decoration: none }
      nav h2 { font: 500 15px/1 'Alegreya Sans', sans-serif; color: var(--dim); margin: 22px 0 8px }
      nav ul { list-style: none; margin: 0; padding: 0 }
      nav li a { display: block; padding: 3px 8px; margin: 0 -8px; border-radius: 4px; text-decoration: none }
      nav li a:hover { background: var(--panel) }
      nav li a[aria-current] { background: var(--panel); font-weight: 700 }
      .ability { color: var(--ability) }
      .effect { color: var(--effect) }
      .mob { color: var(--mob) }
      .place { color: var(--place) }
      .item { color: var(--item) }
      main { padding: 36px 48px 80px; max-width: 980px }
      main h1 { font: 700 44px/1.1 Alegreya, serif; margin: 0 0 6px }
      .kind { color: var(--dim); margin: 0 0 28px }
      .entry { display: grid; grid-template-columns: 1fr 300px; gap: 40px; align-items: start }
      .entry p { max-width: 62ch; margin: 0 0 16px }
      .entry h3 { font: 700 20px/1.2 Alegreya, serif; margin: 30px 0 10px }
      .entry ul { margin: 0; padding-left: 20px }
      .entry li { margin: 4px 0 }
      /* The tooltip: what the game would show over the thing, its numbers in the order a player reads them. */
      .tip {
        background: var(--tip);
        border: 1px solid var(--tipline);
        border-radius: 5px;
        box-shadow: 0 0 0 1px #000, 0 10px 30px #0008;
        padding: 12px 14px;
        font-size: 15px;
        line-height: 1.45;
        position: sticky;
        top: 28px;
      }
      .tip .name { font: 700 19px/1.2 Alegreya, serif; margin-bottom: 4px }
      .tip .row { display: flex; justify-content: space-between; gap: 12px }
      .tip .say { color: #f3d28a; margin-top: 8px }
      .tip .note { color: var(--dim); margin-top: 8px }
      table { border-collapse: collapse; width: 100%; margin: 6px 0 0; font-size: 16px }
      th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top }
      th { font-weight: 500; color: var(--dim) }
      .home h3 { font: 700 22px/1.2 Alegreya, serif; margin: 34px 0 8px }
      .home td:first-child { white-space: nowrap }
      .missing { color: var(--effect) }
      @media (max-width: 820px) {
        body { grid-template-columns: 1fr }
        nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 20px 16px }
        main { padding: 24px 16px 60px }
        .entry { grid-template-columns: 1fr }
        .tip { position: static; order: -1 }
      }
    </style>
  </head>
  <body>
    <nav id="nav"></nav>
    <main id="main"></main>
    <script type="module">
      // The files the hills scene reads (`hills.scene.json`'s catalogue): gas3d's (abilities, effects, cues, caps),
      // mmo3d's (mob templates and their placements), the definitions (the hero's attributes, the abilities it has, its
      // keys) and volley3d's patterns (a bolt's speed and life). Each entry is a page at `#<what>/<name>`.
      import gas from './assets/hills/hills.gas3d.json'
      import mmo from './assets/hills/hills.mmo3d.json'
      import defs from './assets/hills/hills.json'
      import volleys from './assets/hills/volleys.json'
      import inventory from './assets/hills/hills.inventory.json'
      import equipment from './assets/hills/hills.equipment.json'
      import loot from './assets/hills/hills.loot.json'

      const hero = defs.player
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      const words = name => name.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ')
      const title = name => { const w = words(name); return w[0].toUpperCase() + w.slice(1) }
      const link = (what, name) => `<a class="${what}" href="#${what}/${encodeURIComponent(name)}">${esc(title(name))}</a>`
      const num = n => (Number.isInteger(n) ? String(n) : String(+n.toFixed(2)))
      const secs = n => `${num(n)} sec`
      const list = items => (items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>` : '<p>None.</p>')

      // The key a press is played by, as the hero's definition binds it.
      const keyOf = press => (hero.keys.motions[press] ?? []).filter(k => !k.startsWith('Pad')).map(k => (k === 'Mouse0' ? 'left click' : k === ' ' ? 'Space' : k.toUpperCase())).join(' or ')

      // What one modifier does, in words.
      function modifierSays(m, every) {
        const parts = []
        if (m.add !== undefined) parts.push(`${m.add < 0 ? 'takes' : 'gives'} ${num(Math.abs(m.add))} ${words(m.attribute)}`)
        if (m.multiply !== undefined) parts.push(`multiplies ${words(m.attribute)} by ${num(m.multiply)}`)
        return parts.join(' and ') + (every ? (every === 1 ? ' every second' : ` every ${secs(every)}`) : '')
      }

      // What an effect does, in one sentence.
      function effectSays(e) {
        const what = (e.modifiers ?? []).map(m => modifierSays(m, e.every)).join(', ')
        const how = e.duration === 'instant' ? 'at once' : e.duration === 'timed' ? `for ${secs(e.for)}` : 'for as long as it is on'
        const tags = e.tags?.length ? `, and marks the target ${e.tags.map(words).join(', ')}` : ''
        return `${what ? what[0].toUpperCase() + what.slice(1) : 'Changes nothing'} ${how}${tags}.`
      }

      // The mob kinds: every kind the placements name, each with its definition.
      const mobs = Object.fromEntries([...new Set([...mmo.placements, ...mmo.spawns].map(p => p.kind))].filter(kind => defs[kind]?.prey).map(kind => [kind, defs[kind]]))
      // Where an `at` is: a landmark's name, or its coordinates.
      const atSays = at => (typeof at === 'string' ? `the ${esc(words(at.split('/').pop()))} (${esc(at.split('/')[0])})` : at.map(num).join(', '))
      const whenSays = c => (c ? ` while ${esc(c)} holds` : '')
      // Who has each ability: the hero and the mobs, by their definitions.
      const usersOf = name => [
        ...(hero.abilities.includes(name) ? ['the hero'] : []),
        ...Object.entries(mobs).filter(([, m]) => m.abilities.includes(name)).map(([kind]) => link('mob', kind)),
      ]
      const abilitiesApplying = effect => Object.entries(gas.abilities).filter(([, a]) => a.effects.includes(effect)).map(([n]) => n)
      const placementsOf = kind => mmo.placements.filter(p => p.kind === kind)
      const packsOf = kind => mmo.spawns.filter(s => s.kind === kind)

      function abilityPage(name) {
        const a = gas.abilities[name]
        const d = a.delivery
        const bolt = d.bolt ? volleys.patterns[d.bolt] : undefined
        const range = d.reach !== undefined ? `${num(d.reach)} m` : `${num(d.range)} m`
        const cost = Object.entries(a.cost ?? {}).map(([k, v]) => `${num(v)} ${words(k)}`).join(', ')
        const lands = d.reach !== undefined
          ? `It strikes the nearest living mob within ${num(d.reach)} m in front of the user, the moment the blow lands.`
          : `The moment the cast is thrown it fires a bolt at the user's target, or the nearest living mob in front within ${num(d.range)} m. The bolt flies at ${num(bolt.speed)} m a second for up to ${secs(bolt.life)}, and hits anything within ${num(bolt.radius)} m of its line.`
        const tip = `
          <div class="tip">
            <div class="name ability">${esc(title(name))}</div>
            <div class="row"><span>${cost || 'No cost'}</span><span>${range} range</span></div>
            <div class="row"><span>${d.bolt ? 'Thrown' : 'Melee'}</span><span>${a.cooldown ? `${secs(a.cooldown)} cooldown` : 'No cooldown'}</span></div>
            <div class="say">${a.effects.map(e => effectSays(gas.effects[e])).join(' ')}</div>
            <div class="note">Key: ${esc(keyOf(a.press) || a.press)}</div>
          </div>`
        const body = `
          <p>${lands}</p>
          ${a.blocked?.length ? `<p>It cannot be used while the user is ${a.blocked.map(words).join(' or ')}.</p>` : ''}
          <h3>Effects it applies</h3>
          ${list(a.effects.map(e => `${link('effect', e)}: ${esc(effectSays(gas.effects[e]))}`))}
          <h3>Used by</h3>
          ${list(usersOf(name))}`
        return page(name, 'Ability', body, tip)
      }

      function effectPage(name) {
        const e = gas.effects[name]
        const cue = (e.tags ?? []).filter(t => gas.cues[t]).map(t => `While ${words(t)}, the target shows the ${words(gas.cues[t])} effect.`).join(' ')
        const tip = `
          <div class="tip">
            <div class="name effect">${esc(title(name))}</div>
            <div class="row"><span>${e.duration === 'instant' ? 'Instant' : e.duration === 'timed' ? `Lasts ${secs(e.for)}` : 'Until removed'}</span><span>${e.every ? `Every ${secs(e.every)}` : ''}</span></div>
            <div class="say">${esc(effectSays(e))}</div>
          </div>`
        const users = abilitiesApplying(name)
        const body = `
          <p>${esc(effectSays(e))}${cue ? ` ${esc(cue)}` : ''}</p>
          <h3>Changes</h3>
          ${list((e.modifiers ?? []).map(m => esc(modifierSays(m, e.every))))}
          <h3>Applied by</h3>
          ${list([...users.map(a => link('ability', a)), ...(hero.effects.includes(name) ? ['the hero, always'] : [])])}`
        return page(name, 'Effect', body, tip)
      }

      function mobPage(name) {
        const t = mobs[name]
        const at = t.attributes
        const hunt = t.behaviors.hunt
        const tip = `
          <div class="tip">
            <div class="name mob">${esc(title(name))}</div>
            <div class="row"><span>Health</span><span>${num(at.health)} / ${num(at.maxHealth ?? at.health)}</span></div>
            <div class="row"><span>Sees</span><span>${num(t.sight.range)} m</span></div>
            <div class="say">${t.abilities.map(a => `Uses ${esc(title(a))}.`).join(' ')}</div>
          </div>`
        const hits = hero.abilities.map(n => [n, gas.abilities[n]]).map(([n, a]) => {
          const dmg = a.effects.flatMap(e => (gas.effects[e].modifiers ?? []).filter(m => m.attribute === 'health' && m.add < 0).map(m => -m.add * (gas.effects[e].every ? gas.effects[e].for / gas.effects[e].every : 1))).reduce((s, v) => s + v, 0)
          return dmg > 0 ? `<tr><td>${link('ability', n)}</td><td>${num(dmg)}</td><td>${Math.ceil(at.health / dmg)}</td></tr>` : ''
        }).join('')
        const body = `
          <p>A mob of ${num(at.health)} health. It notices ${t.prey.map(words).join(' or ')} within ${num(t.sight.range)} m in front of it, walks to them while they are within ${num(hunt.range)} m, and in reach uses ${t.abilities.map(a => link('ability', a)).join(', ')}. Struck, it plays its ${esc(words(t.hit.clip))} clip; at 0 health it plays ${esc(words(t.behaviors[t.dies].clip))} and lies dead for ${secs(t.behaviors[t.dies].for)}.</p>
          ${t.loot ? `<h3>What it drops</h3><p>${num(loot.loot[t.loot].gold[0])} to ${num(loot.loot[t.loot].gold[1])} gold, to whoever killed it, and:</p>${list(loot.loot[t.loot].entries.map(d => `${link('item', d.item)}: ${chanceSays(d)}`))}` : ''}
          <h3>How many hits it takes</h3>
          <table><tr><th>Ability</th><th>Health it takes</th><th>To kill</th></tr>${hits}</table>
          <h3>Where it stands</h3>
          ${list([
            ...placementsOf(name).map(p => { const i = mmo.placements.indexOf(p); return `<a class="place" href="#place/${i}">Placement ${i + 1}</a> at ${atSays(p.at)}` }),
            ...packsOf(name).map(s => { const i = mmo.spawns.indexOf(s); return `<a class="place" href="#pack/${i}">Pack ${i + 1}</a>: ${num(s.count)} within ${num(s.spread)} m of ${atSays(s.at)}` }),
          ])}`
        return page(name, 'Mob', body, tip)
      }

      function placePage(i) {
        const p = mmo.placements[+i]
        if (!p) return missing('place', i)
        const body = `
          <p>${link('mob', p.kind)} stands at ${atSays(p.at)}${whenSays(p.when)}.</p>`
        return `<h1>Placement ${+i + 1}</h1><p class="kind">Placement</p><div class="entry"><div>${body}</div></div>`
      }

      function packPage(i) {
        const s = mmo.spawns[+i]
        if (!s) return missing('pack', i)
        const back = s.respawn === undefined ? 'A mob of it killed does not come back.' : `A mob of it killed comes back ${secs(s.respawn)} later.`
        const body = `
          <p>${num(s.count)} ${link('mob', s.kind)} stand within ${num(s.spread)} m of ${atSays(s.at)}${whenSays(s.when)}. ${back}</p>`
        return `<h1>Pack ${+i + 1}</h1><p class="kind">Pack</p><div class="entry"><div>${body}</div></div>`
      }

      // The loot tables an item drops from, and the mobs that roll each.
      const items = inventory.items
      const dropsOf = item => Object.entries(loot.loot).flatMap(([t, l]) => l.entries.filter(d => d.item === item).map(d => ({ table: t, ...d })))
      const rollersOf = table => Object.entries(mobs).filter(([, m]) => m.loot === table).map(([k]) => k)
      const chanceSays = d => `${num(d.chance)}%${d.group ? ` (at most one of group ${d.group})` : ''}${d.max > 1 ? `, ${num(d.min)} to ${num(d.max)}` : ''}`
      // The effects equipping an item puts on: its equipment's ability sets' effects.
      const equippedEffects = name => {
        const e = items[name].fragments.equippable
        return e ? equipment.equipment[e.equipment].abilitySets.flatMap(s => gas.abilitySets[s].effects ?? []) : []
      }

      function itemPage(name) {
        const f = items[name].fragments
        const grade = f.quality?.grade
        const wears = equippedEffects(name)
        const tip = `
          <div class="tip">
            <div class="name item">${esc(items[name].name)}</div>
            <div class="row"><span>${grade ? esc(title(grade)) : ''}</span><span>${f.equippable ? 'Equippable' : 'Carried'}</span></div>
            ${wears.length ? `<div class="say">Equipped: ${esc(wears.map(e => effectSays(gas.effects[e])).join(' '))}</div>` : ''}
            ${f.price ? `<div class="note">Sells for ${num(f.price.sell)} gold</div>` : ''}
          </div>`
        const from = dropsOf(name).flatMap(d => rollersOf(d.table).map(k => `${link('mob', k)}: ${chanceSays(d)}`))
        const body = `
          <p>${f.equippable ? 'Equipped, worn or held on the quick bar.' : grade === 'grey' ? 'Junk, carried only to be sold.' : 'Carried.'}${f.price ? ` A trader pays ${num(f.price.sell)} gold for one.` : ''}</p>
          ${wears.length ? `<h3>While equipped</h3>${list(wears.map(e => `${link('effect', e)}: ${esc(effectSays(gas.effects[e]))}`))}` : ''}
          <h3>Dropped by</h3>
          ${list(from)}`
        return `<h1>${esc(items[name].name)}</h1><p class="kind">Item</p><div class="entry"><div>${body}</div>${tip}</div>`
      }

      function page(name, kind, body, tip) {
        return `<h1>${esc(title(name))}</h1><p class="kind">${kind}</p><div class="entry"><div>${body}</div>${tip}</div>`
      }

      const missing = (what, name) => `<h1>Not found</h1><p class="missing">There is no ${esc(what)} called ${esc(name)} in the hills' files.</p><p><a href="#">Back to the start</a></p>`

      function home() {
        const rows = (what, entries, say) => entries.map(([n, x]) => `<tr><td>${link(what, n)}</td><td>${esc(say(x, n))}</td></tr>`).join('')
        return `
          <div class="home">
            <h1>The hills</h1>
            <p class="kind">Everything in the hills scene's files, read as the game reads them.</p>
            <h3>Abilities</h3>
            <table>${rows('ability', Object.entries(gas.abilities), a => a.effects.map(e => effectSays(gas.effects[e])).join(' '))}</table>
            <h3>Effects</h3>
            <table>${rows('effect', Object.entries(gas.effects), effectSays)}</table>
            <h3>Items</h3>
            <table>${rows('item', Object.entries(items).filter(([n]) => n !== 'gold'), i => `${i.fragments.quality ? title(i.fragments.quality.grade) : ''}${i.fragments.equippable ? ', equippable' : ''}${i.fragments.price ? `, sells for ${num(i.fragments.price.sell)} gold` : ''}`)}</table>
            <h3>Mobs</h3>
            <table>${rows('mob', Object.entries(mobs), (t, n) => `${num(t.attributes.health)} health, ${packsOf(n).reduce((s, p) => s + p.count, 0) + placementsOf(n).length} in the place`)}</table>
          </div>`
      }

      function navigation(current) {
        const group = (label, what, names) => `<h2>${label}</h2><ul>${names.map(n => `<li><a class="${what}" href="#${what}/${encodeURIComponent(n)}"${current === `${what}/${n}` ? ' aria-current="page"' : ''}>${esc(title(n))}</a></li>`).join('')}</ul>`
        return `<h1><a href="#">Hills wiki</a></h1>
          ${group('Abilities', 'ability', Object.keys(gas.abilities))}
          ${group('Effects', 'effect', Object.keys(gas.effects))}
          ${group('Mobs', 'mob', Object.keys(mobs))}
          ${group('Items', 'item', Object.keys(items).filter(n => n !== 'gold'))}`
      }

      function show() {
        const at = decodeURIComponent(location.hash.slice(1))
        const [what, name] = at.split('/')
        const pages = { ability: [gas.abilities, abilityPage], effect: [gas.effects, effectPage], mob: [mobs, mobPage], item: [items, itemPage] }
        let html
        if (!at) html = home()
        else if (what === 'place') html = placePage(name)
        else if (what === 'pack') html = packPage(name)
        else if (pages[what]) html = pages[what][0][name] ? pages[what][1](name) : missing(what, name)
        else html = missing('page', at)
        document.getElementById('main').innerHTML = html
        document.getElementById('nav').innerHTML = navigation(at)
        document.title = at && name ? `${title(name)}, hills wiki` : 'Hills wiki'
        scrollTo(0, 0)
      }
      addEventListener('hashchange', show)
      show()
    </script>
  </body>
</html>
