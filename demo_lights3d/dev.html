<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_lights3d dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
      .lil-gui.root { max-height: 100vh; overflow-y: auto }
      #readout { position: fixed; left: 8px; bottom: 8px; color: #e8e8e8; font: 13px monospace; white-space: pre; background: #000a; padding: 6px 8px; pointer-events: none }
    </style>
  </head>
  <body>
    <div id="readout"></div>
    <script type="module">
      // The testbed: index.html, the manager truth and the scenes its row names all in this tab, one
      // seat on them over a loopback, stepped on the page's clock. The truths are kept on
      // `window.__scenes` and the page on `window.__page` for the profilers (benchmarking-a-game). The
      // frame rate is the stats plugin's panel at the top left. The readout shows the scene, the step,
      // who lights the lamps and how many lights3d clustered, and the last five errors the page threw
      // or wrote.
      // The address:
      //   ?scene=<scene>   enters that scene: main (the room: everything at once), swarm (400 drifting
      //                    lamps, no shadows), hall (spot beams sweeping through fog, shadowed),
      //                    gallery (a mirror floor, metal balls smooth to rough, a refreshing probe),
      //                    mist (ground fog clumping and drifting through lamps on a moor of stones),
      //                    panel (a dark room and a glowing panel showing a picture, the experiment in
      //                    lights that are a picture)
      //   ?three=1         takes lights3d out of the scene entered, so three's own loop lights every
      //                    lamp: the same stage drawn both ways, to be compared
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import GUI from 'lil-gui'
      import { imported } from '#engine/browser.ts'
      import { sim } from './demo_lights3d.sim.ts'
      import file from './demo_lights3d.scene.json'

      // Every error the page throws or writes, the last five, shown under the readout.
      const errors = []
      const caught = e => {
        errors.push(String(e?.message ?? e))
        if (errors.length > 5) errors.shift()
      }
      addEventListener('error', e => caught(e.error ?? e.message))
      addEventListener('unhandledrejection', e => caught(e.reason))
      const written = console.error.bind(console)
      console.error = (...a) => { caught(a.map(x => x?.message ?? x).join(' ')); written(...a) }

      const params = new URLSearchParams(location.search)
      file.prefabs.scenemanager.entry = params.get('scene') ?? file.prefabs.scenemanager.entry
      // The scene entered, from its own sim module at the url the scenemanager imports it at, so the
      // truth and the page read the one object.
      const entry = file.prefabs.scenemanager.scenes[file.prefabs.scenemanager.entry]
      if (!entry) throw new Error(`demo_lights3d has no scene ${file.prefabs.scenemanager.entry}: ${Object.keys(file.prefabs.scenemanager.scenes).join(', ')}`)
      const { scene: entered } = await imported(new URL(entry.file.replace(/\.scene\.json$/, '.sim.ts'), import.meta.url).href)
      const three = params.get('three') === '1'
      if (three) {
        entered.plugins = entered.plugins.filter(p => p !== 'lights3d')
        delete entered.world.lights3d
      }

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      window.__scenes = await load(truth, import.meta.url)
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
        me.plugins.stats?.mount(document.body)
      })
      window.__page = page
      const readout = document.getElementById('readout')

      // The panel. A press on it stops at it, a release never does, and after a click the focus goes
      // back to the page unless it went into a number to type or a list to pick from.
      const gui = new GUI({ title: 'demo_lights3d dev' })
      for (const type of ['keydown', 'keyup', 'click', 'mousedown', 'contextmenu', 'wheel'])
        gui.domElement.addEventListener(type, e => e.stopPropagation())
      gui.domElement.addEventListener('pointerup', () => requestAnimationFrame(() => {
        const at = document.activeElement
        if (gui.domElement.contains(at) && at.tagName !== 'SELECT' && !(at.tagName === 'INPUT' && (at.type === 'text' || at.type === 'number'))) at.blur()
      }))
      addEventListener('change', e => { if (gui.domElement.contains(e.target)) e.target.blur() })

      // The scene, chosen from the manager's table, the page loaded again on it.
      const chosen = { scene: file.prefabs.scenemanager.entry }
      const reload = (key, value) => { const url = new URL(location.href); url.searchParams.set(key, value); location.href = url.href }
      gui.add(chosen, 'scene', Object.keys(file.prefabs.scenemanager.scenes)).onChange(s => reload('scene', s))
      gui.add({ lights3d: !three }, 'lights3d').name('lit by lights3d (reloads)').onChange(v => reload('three', v ? '0' : '1'))

      // The fog, live: each number is lights3d's `world.lights3d.fog` on the page's own copy of the scene,
      // read by the fog every frame. "copy fog JSON" copies them for main.scene.json.
      const fog = entered.world.lights3d?.fog
      if (fog) {
        const ff = gui.addFolder('fog')
        ff.add(fog, 'density', 0, 0.3, 0.001).name('density (share a metre)')
        ff.add(fog, 'steps', 4, 256, 1).name('steps a ray')
        ff.add(fog, 'resolution', 0.1, 1, 0.05).name('resolution (share of the frame)')
        ff.add(fog, 'blend', 0.02, 1, 0.01).name('blend (share of a new frame; 1 none)')
        ff.add(fog, 'g', -0.95, 0.95, 0.01).name('g (throws light on toward the eye)')
        ff.add(fog, 'far', 1, 200, 1).name('far (m, a ray that meets nothing)')
        ff.addColor(fog, 'colour').name('colour (its own light)')
        if (fog.noise) {
          const nf = ff.addFolder('noise')
          nf.add(fog.noise, 'size', 2, 200, 0.5).name('size (m it repeats over)')
          nf.add(fog.noise, 'layers', 1, 4, 1).name('layers')
          nf.add(fog.noise, 'strength', 0, 1, 0.01).name('strength (0 even, 1 clumps)')
          nf.add(fog.noise.wind, '0', -10, 10, 0.05).name('wind x (m/s)')
          nf.add(fog.noise.wind, '1', -5, 5, 0.05).name('wind y (m/s)')
          nf.add(fog.noise.wind, '2', -10, 10, 0.05).name('wind z (m/s)')
        }
        if (fog.height) {
          const hf = ff.addFolder('height')
          hf.add(fog.height, 'floor', -5, 20, 0.1).name('floor (m, full below)')
          hf.add(fog.height, 'thinning', 0.2, 30, 0.1).name('thinning (m to halve)')
        }
        ff.add({ copy: () => navigator.clipboard.writeText(JSON.stringify(fog, null, 2)) }, 'copy').name('copy fog JSON')
      }

      let last = performance.now(), owed = 0
      const loop = async now => {
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        // A frame that throws is shown, and the next frame goes on.
        try {
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          await page.frame(owed / dt)
        } catch (e) { caught(e) }
        const l3 = page.client?.plugins.lights3d
        const lit = l3 ? `lit by lights3d: ${l3.count} lights, ${l3.shadowed} with shadows in ${l3.tiles} tiles, ${l3.redrawn} still tiles drawn this frame, ${l3.moving} moving tiles, ${l3.entries} in cells` : 'lit by three'
        readout.textContent = [`${chosen.scene}  step ${truth.n}  ${lit}`, ...errors].join('\n')
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
