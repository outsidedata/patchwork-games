<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_lights3d dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
      .lil-gui.root { max-height: 100vh; overflow-y: auto }
      #readout { position: fixed; left: 8px; bottom: 8px; color: #e8e8e8; font: 13px monospace; white-space: pre; background: #000a; padding: 6px 8px; pointer-events: none }
    </style>
  </head>
  <body>
    <div id="readout"></div>
    <script type="module">
      // The testbed: index.html, the manager truth and the scenes its row names all in this tab, one
      // seat on them over a loopback, stepped on the page's clock. The truths are kept on
      // `window.__scenes` and the page on `window.__page` for the profilers (benchmarking-a-game). The
      // frame rate is the stats plugin's panel at the top left. The readout shows the scene, the step,
      // who lights the lamps and how many lights3d clustered, and the last five errors the page threw
      // or wrote.
      // The address:
      //   ?scene=<scene>   enters that scene: main (the room: everything at once), swarm (400 drifting
      //                    lamps, no shadows), hall (spot beams sweeping through fog, shadowed),
      //                    gallery (a mirror floor, metal balls smooth to rough, a refreshing probe),
      //                    mist (ground fog clumping and drifting through lamps on a moor of stones),
      //                    panel (a dark room and a glowing panel showing a picture, the experiment in
      //                    lights that are a picture)
      //   ?three=1         takes lights3d out of the scene entered, so three's own loop lights every
      //                    lamp: the same stage drawn both ways, to be compared
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import GUI from 'lil-gui'
      import { imported } from '#engine/browser.ts'
      import { prepared } from '#plugins/loader/loader.sim.ts'
      import { sim } from './demo_lights3d.sim.ts'
      import file from './demo_lights3d.scene.json'

      // Every error the page throws or writes, the last five, shown under the readout.
      const errors = []
      const caught = e => {
        errors.push(String(e?.message ?? e))
        if (errors.length > 5) errors.shift()
      }
      addEventListener('error', e => caught(e.error ?? e.message))
      addEventListener('unhandledrejection', e => caught(e.reason))
      const written = console.error.bind(console)
      console.error = (...a) => { caught(a.map(x => x?.message ?? x).join(' ')); written(...a) }

      const params = new URLSearchParams(location.search)
      file.prefabs.scenemanager.entry = params.get('scene') ?? file.prefabs.scenemanager.entry
      // The scene entered, from its own sim module at the url the scenemanager imports it at, so the
      // truth and the page read the one object.
      const entry = file.prefabs.scenemanager.scenes[file.prefabs.scenemanager.entry]
      if (!entry) throw new Error(`demo_lights3d has no scene ${file.prefabs.scenemanager.entry}: ${Object.keys(file.prefabs.scenemanager.scenes).join(', ')}`)
      const { scene: entered } = await imported(new URL(entry.file.replace(/\.scene\.json$/, '.sim.ts'), import.meta.url).href)
      const three = params.get('three') === '1'
      if (three) {
        entered.plugins = entered.plugins.filter(p => p !== 'lights3d')
        delete entered.world.lights3d
      }
      // What is built once, set from the address before the boot, each switched on, off or sized so its cost can be
      // seen (the "reloads" folder writes these and loads the page again):
      //   shadows=0|1, atlas=, tile=   lights3d's shadows, and its atlases' and tiles' texels
      //   probes=0|1, probeSize=       lights3d's probes, and a face's texels
      //   fog=0|1                      lights3d's fog (a scene with none is given a thin one)
      //   ssr=0|1                      render3d's screen-space reflections
      //   glow=0|1                     supershader3d's glowmap, the pass lights3d lights the glow from
      //   ratio=                       the pixel ratio drawn at
      const wanted = k => params.get(k)
      const number = k => (params.has(k) ? Number(params.get(k)) : undefined)
      const l3world = entered.world.lights3d
      if (l3world) {
        if (wanted('shadows') === '0') delete l3world.shadows
        if (wanted('shadows') === '1' && !l3world.shadows) l3world.shadows = { atlas: 2048, tile: 512, bias: 0.06, normalBias: 0.12, budget: 8 }
        if (l3world.shadows && number('atlas')) l3world.shadows.atlas = number('atlas')
        if (l3world.shadows && number('tile')) l3world.shadows.tile = number('tile')
        if (wanted('probes') === '0') delete l3world.probes
        if (l3world.probes && number('probeSize')) l3world.probes.size = number('probeSize')
        if (wanted('fog') === '0') delete l3world.fog
        if (wanted('fog') === '1' && !l3world.fog) l3world.fog = { density: 0.03, colour: '#020304', steps: 32, g: 0.3, far: 30, resolution: 0.4, blend: 0.1 }
      }
      const r3prefab = entered.prefabs.render3d
      if (r3prefab) {
        if (wanted('ssr') === '0') delete r3prefab.ssr
        if (wanted('ssr') === '1' && !r3prefab.ssr) r3prefab.ssr = { steps: 32, distance: 6, thickness: 0.3, roughness: 0.4 }
        if (number('ratio')) r3prefab.pixelRatio = number('ratio')
      }
      if (wanted('glow') === '0' && entered.world.supershader3d) delete entered.world.supershader3d.glowmap
      const glowmap = entered.world.supershader3d?.glowmap

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      window.__scenes = await load(truth, import.meta.url)
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
        me.plugins.stats?.mount(document.body)
      })
      window.__page = page
      const readout = document.getElementById('readout')

      // The panel. A press on it stops at it, a release never does, and after a click the focus goes
      // back to the page unless it went into a number to type or a list to pick from.
      const gui = new GUI({ title: 'demo_lights3d dev' })
      for (const type of ['keydown', 'keyup', 'click', 'mousedown', 'contextmenu', 'wheel'])
        gui.domElement.addEventListener(type, e => e.stopPropagation())
      gui.domElement.addEventListener('pointerup', () => requestAnimationFrame(() => {
        const at = document.activeElement
        if (gui.domElement.contains(at) && at.tagName !== 'SELECT' && !(at.tagName === 'INPUT' && (at.type === 'text' || at.type === 'number'))) at.blur()
      }))
      addEventListener('change', e => { if (gui.domElement.contains(e.target)) e.target.blur() })

      // The scene, chosen from the manager's table, the page loaded again on it.
      const chosen = { scene: file.prefabs.scenemanager.entry }
      const reload = (key, value) => { const url = new URL(location.href); url.searchParams.set(key, value); location.href = url.href }
      gui.add(chosen, 'scene', Object.keys(file.prefabs.scenemanager.scenes)).onChange(s => reload('scene', s))
      gui.add({ lights3d: !three }, 'lights3d').name('lit by lights3d (reloads)').onChange(v => reload('three', v ? '0' : '1'))

      // The fog, live: each number is lights3d's `world.lights3d.fog` on the page's own copy of the scene,
      // read by the fog every frame. "copy fog JSON" copies them for main.scene.json.
      const fog = entered.world.lights3d?.fog
      if (fog) {
        const ff = gui.addFolder('fog')
        ff.add(fog, 'density', 0, 0.3, 0.001).name('density (share a metre)')
        ff.add(fog, 'steps', 4, 256, 1).name('steps a ray')
        ff.add(fog, 'resolution', 0.1, 1, 0.05).name('resolution')
        ff.add(fog, 'blend', 0.02, 1, 0.01).name('blend')
        ff.add(fog, 'g', -0.95, 0.95, 0.01).name('g')
        ff.add(fog, 'far', 1, 200, 1).name('far (m)')
        ff.addColor(fog, 'colour').name('colour (its own light)')
        if (fog.noise) {
          const nf = ff.addFolder('noise')
          nf.add(fog.noise, 'size', 2, 200, 0.5).name('size (m it repeats over)')
          nf.add(fog.noise, 'layers', 1, 4, 1).name('layers')
          nf.add(fog.noise, 'strength', 0, 1, 0.01).name('strength (0 even, 1 clumps)')
          nf.add(fog.noise.wind, '0', -10, 10, 0.05).name('wind x (m/s)')
          nf.add(fog.noise.wind, '1', -5, 5, 0.05).name('wind y (m/s)')
          nf.add(fog.noise.wind, '2', -10, 10, 0.05).name('wind z (m/s)')
        }
        if (fog.height) {
          const hf = ff.addFolder('height')
          hf.add(fog.height, 'floor', -5, 20, 0.1).name('floor (m, full below)')
          hf.add(fog.height, 'thinning', 0.2, 30, 0.1).name('thinning (m to halve)')
        }
        ff.add({ copy: () => navigator.clipboard.writeText(JSON.stringify(fog, null, 2)) }, 'copy').name('copy fog JSON')
      }

      // The panels, live, in a scene whose stage has them: each number is the stage's definition in the
      // tab's one copy of `assets/demo_lights3d.json`, read by the stage every frame, and lights3d's areas'
      // `blur` and `cutoff` on the page's own copy of the scene, read by lights3d every frame.
      const defs = await prepared(entered.world, entered.world.defs)
      // kept for the console: __defs.stage.<set> is what the stage draws from
      window.__defs = defs
      const set = defs.stage[entered.prefabs.stage.set]
      if (set.kit || set.people) {
        const sf = gui.addFolder('show')
        if (set.kit) sf.add(set.kit, 'shown').name('pillar + stone ring')
        for (const p of set.people ?? []) sf.add(p, 'shown').name(p.model)
      }
      if (set.panels) {
        const pf = gui.addFolder('panels')
        pf.add(set, 'floorRoughness', 0, 1, 0.01).name('floor roughness')
        set.panels.forEach((pn, i) => {
          const f = pf.addFolder(`panel ${i}`)
          f.add(pn.at, '0', -8, 8, 0.05).name('x (m)')
          f.add(pn.at, '1', 0, 6, 0.05).name('y (m)')
          f.add(pn.at, '2', -8, 8, 0.05).name('z (m)')
          f.add(pn, 'turn', -180, 180, 1).name('turn (degrees)')
          f.add(pn.size, '0', 0.2, 12, 0.1).name('width (m)')
          f.add(pn.size, '1', 0.2, 6, 0.1).name('height (m)')
          f.add(pn, 'intensity', 0, 40, 0.1).name('light intensity')
          f.add(pn, 'glow', 0, 4, 0.01).name('glow (its own brightness)')
          f.addColor(pn, 'colour').name('light colour')
          if (pn.scroll !== undefined) f.add(pn, 'scroll', -1, 1, 0.01).name('scroll')
        })
        const ar = entered.world.lights3d?.areas
        if (ar) {
          pf.add(ar, 'blur', 0.05, 4, 0.01).name('blur')
          pf.add(ar, 'cutoff', 0.0001, 0.05, 0.0001).name('cutoff')
        }
      }

      // lights3d's light from glowing materials, live: `areas.glow` on the page's own copy of the scene, read every frame
      const glowing = entered.world.lights3d?.areas?.glow
      if (glowing) {
        gui.add(glowing, 'gain', 0, 100, 0.1).name('glow gain')
        // kept for the console: __glow.gain
        window.__glow = glowing
      }

      // Live, read every frame: render3d's screen-space reflections, lights3d's probes' refresh and the glowmap's pass's
      // resolution, each on the page's own copy of the scene.
      const live = gui.addFolder('live')
      const ssr = entered.prefabs.render3d?.ssr
      if (ssr) {
        live.add(ssr, 'steps', 1, 128, 1).name('ssr steps')
        live.add(ssr, 'distance', 0.5, 30, 0.1).name('ssr distance')
        live.add(ssr, 'thickness', 0.02, 2, 0.01).name('ssr thickness')
        live.add(ssr, 'roughness', 0.02, 1, 0.01).name('ssr max rough')
      }
      const probes = entered.world.lights3d?.probes
      if (probes) {
        live.add(probes, 'refresh', 0, 6, 1).name('probe faces/frame')
        live.add({ capture: () => page.client?.plugins.lights3d?.capture() }, 'capture').name('recapture probes')
      }
      if (glowmap) live.add(glowmap, 'resolution', 0.05, 1, 0.05).name('glow pass res')

      // Built once: each switched or sized here loads the page again with it in the address, so what each costs is seen
      // by the frame rate before and after.
      const reloads = gui.addFolder('reloads')
      reloads.close()
      const r = {
        shadows: !!l3world?.shadows, atlas: l3world?.shadows?.atlas ?? 2048, tile: l3world?.shadows?.tile ?? 512,
        probes: !!l3world?.probes, probeSize: l3world?.probes?.size ?? 128,
        fog: !!l3world?.fog, ssr: !!r3prefab?.ssr,
        glow: !!glowmap,
        ratio: r3prefab?.pixelRatio ?? 1,
      }
      reloads.add(r, 'shadows').name('shadows').onChange(v => reload('shadows', v ? '1' : '0'))
      reloads.add(r, 'atlas', [512, 1024, 2048, 4096]).name('shadow atlas (texels)').onChange(v => reload('atlas', v))
      reloads.add(r, 'tile', [128, 256, 512, 1024]).name('shadow tile (texels)').onChange(v => reload('tile', v))
      reloads.add(r, 'probes').name('probes').onChange(v => reload('probes', v ? '1' : '0'))
      reloads.add(r, 'probeSize', [32, 64, 128, 256, 512]).name('probe face (texels)').onChange(v => reload('probeSize', v))
      reloads.add(r, 'fog').name('fog').onChange(v => reload('fog', v ? '1' : '0'))
      reloads.add(r, 'ssr').name('ssr').onChange(v => reload('ssr', v ? '1' : '0'))
      if (entered.world.lights3d?.areas?.glow) reloads.add(r, 'glow').name('glowmap').onChange(v => reload('glow', v ? '1' : '0'))
      reloads.add(r, 'ratio', [0.5, 0.75, 1, 1.5, 2]).name('pixel ratio').onChange(v => reload('ratio', v))

      let last = performance.now(), owed = 0
      const loop = async now => {
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        // A frame that throws is shown, and the next frame goes on.
        // every draw call and triangle of the whole frame, every render in it counted (three resets its counts at each
        // render by itself: here once a frame)
        const info = page.client?.plugins.render3d?.renderer?.info
        if (info) { info.autoReset = false; info.reset() }
        try {
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          await page.frame(owed / dt)
        } catch (e) { caught(e) }
        const drawn = info ? `  frame: ${info.render.calls} draw calls, ${(info.render.triangles / 1e6).toFixed(2)} M triangles, ${info.programs?.length ?? 0} programs` : ''
        const l3 = page.client?.plugins.lights3d
        const lit = l3 ? `lit by lights3d: ${l3.count} lights, ${l3.shadowed} with shadows in ${l3.tiles} tiles, ${l3.redrawn} still tiles drawn this frame, ${l3.moving} moving tiles, ${l3.entries} in cells` : 'lit by three'
        readout.textContent = [`${chosen.scene}  step ${truth.n}  ${lit}`, drawn, ...errors].join('\n')
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
